name: Deploy to Render

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: render-deploy
  cancel-in-progress: false

jobs:
  trigger-render:
    name: Trigger Render Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Call Render Deploy Hook
        env:
          HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "::error::Secret RENDER_DEPLOY_HOOK_URL is not configured."
            exit 1
          fi

          echo "Triggering Render deploy for commit: $GITHUB_SHA"

          response=$(curl -sS -o /tmp/body -w "%{http_code}" -X POST "$HOOK_URL")

          echo "HTTP $response"
          echo "Body:"
          cat /tmp/body || true
          echo

          if [ "$response" != "200" ] && [ "$response" != "201" ]; then
            echo "::error::Render deploy hook returned non-success status."
            exit 1
          fi

          echo "Render deploy successfully triggered."
