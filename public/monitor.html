<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>粤程助手 · 数据监控</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f0f2f5;--card:#fff;--border:#e4e7ed;--text:#1d2129;--text-secondary:#86909c;
  --green:#00b42a;--yellow:#ff7d00;--red:#f53f3f;--blue:#165dff;--gray:#c9cdd4;
  --green-bg:#e8ffea;--yellow-bg:#fff7e8;--red-bg:#ffece8;--blue-bg:#e8f3ff;--gray-bg:#f2f3f5;
}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;font-size:14px}
.container{max-width:1200px;margin:0 auto;padding:20px 16px}

header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
header h1{font-size:18px;font-weight:600}
.header-right{display:flex;align-items:center;gap:12px}
.refresh-btn{background:var(--blue);color:#fff;border:none;padding:6px 16px;border-radius:6px;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:4px;transition:opacity .2s}
.refresh-btn:hover{opacity:.85}
.refresh-btn:disabled{opacity:.5;cursor:not-allowed}
.auto-label{font-size:12px;color:var(--text-secondary)}
.updated-at{font-size:12px;color:var(--text-secondary)}

/* Overview cards */
.overview-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:20px}
.ov-card{background:var(--card);border-radius:10px;padding:16px 18px;border:1px solid var(--border)}
.ov-card .label{font-size:12px;color:var(--text-secondary);margin-bottom:4px}
.ov-card .value{font-size:26px;font-weight:700;line-height:1.2}
.ov-card .sub{font-size:12px;color:var(--text-secondary);margin-top:4px}
.ov-card .sub b{color:var(--text);font-weight:600}

/* Geo map */
.map-tabs{display:flex;gap:4px;margin-bottom:12px;border-bottom:1px solid var(--border)}
.map-tab{padding:8px 14px;font-size:13px;cursor:pointer;border-bottom:2px solid transparent;color:var(--text-secondary);font-weight:500}
.map-tab.active{color:var(--blue);border-bottom-color:var(--blue)}
.map-controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.map-controls select{padding:5px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:#fff;color:var(--text)}
.map-controls label{display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none;font-size:13px;color:var(--text-secondary)}
.map-controls label input{margin:0}
.map-grid{display:grid;grid-template-columns:1fr 260px;gap:16px}
@media(max-width:900px){.map-grid{grid-template-columns:1fr}}
#geoMap{height:560px;width:100%}
.side-panel{display:flex;flex-direction:column;gap:12px}
.panel{border:1px solid var(--border);border-radius:8px;padding:12px 14px;background:#fafbfc}
.panel h3{font-size:13px;font-weight:600;margin-bottom:8px;color:var(--text);display:flex;justify-content:space-between;align-items:center}
.panel h3 .hint{font-size:11px;color:var(--text-secondary);font-weight:400}
.topn{list-style:none;display:flex;flex-direction:column;gap:4px}
.topn li{display:flex;align-items:center;gap:8px;font-size:12px;padding:4px 6px;border-radius:4px;cursor:pointer;transition:background .15s}
.topn li:hover{background:var(--gray-bg)}
.topn .rank{width:20px;height:20px;border-radius:50%;background:var(--gray-bg);color:var(--text-secondary);font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.topn li:nth-child(1) .rank{background:#ffd666;color:#875a00}
.topn li:nth-child(2) .rank{background:#d9d9d9;color:#4d4d4d}
.topn li:nth-child(3) .rank{background:#ffbb96;color:#7a3415}
.topn .name{flex:1;font-weight:500}
.topn .val{color:var(--text-secondary);font-variant-numeric:tabular-nums}
.cross-list{list-style:none;display:flex;flex-direction:column;gap:6px;font-size:12px;max-height:200px;overflow-y:auto}
.cross-list li{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--border);gap:8px}
.cross-list li:last-child{border-bottom:none}
.cross-list .to{font-weight:500}
.cross-list .from{color:var(--text-secondary);font-size:11px}
.cross-empty{color:var(--text-secondary);font-size:12px;text-align:center;padding:12px}

/* Section */
.section{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin-bottom:16px}
.section-title{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.section-title .count{background:var(--gray-bg);color:var(--text-secondary);font-size:12px;padding:1px 8px;border-radius:10px;font-weight:500}

/* Toolbar */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar select,.toolbar input{padding:5px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:#fff;color:var(--text)}
.toolbar input{width:160px}

/* Coverage matrix */
.matrix-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.matrix{border-collapse:collapse;width:100%;font-size:12px;white-space:nowrap}
.matrix th,.matrix td{padding:5px 6px;text-align:center;border-bottom:1px solid var(--border)}
.matrix thead th{position:sticky;top:0;background:var(--card);z-index:2;font-weight:600;color:var(--text-secondary);font-size:11px}
.matrix th.route-col{text-align:left;min-width:140px;position:sticky;left:0;background:var(--card);z-index:3}
.matrix td.route-cell{text-align:left;position:sticky;left:0;background:var(--card);z-index:1;font-weight:500}
.matrix td.route-cell .source-tag{font-size:10px;padding:0 4px;border-radius:3px;margin-left:4px;font-weight:400}
.matrix td.route-cell .source-tag.yuecx{background:#e8f3ff;color:#165dff}
.matrix td.route-cell .source-tag.busboss{background:#fff7e8;color:#ff7d00}
.matrix td.route-cell .hot-star{color:#ff7d00;margin-right:2px}
.matrix td.route-cell .stale{font-size:10px;color:var(--red);margin-left:4px}

.cell{display:inline-block;min-width:28px;padding:2px 4px;border-radius:4px;font-weight:600;font-size:11px;cursor:default;position:relative}
.cell.c-green{background:var(--green-bg);color:var(--green)}
.cell.c-yellow{background:var(--yellow-bg);color:var(--yellow)}
.cell.c-red{background:var(--red-bg);color:var(--red)}
.cell.c-gray{background:var(--gray-bg);color:var(--gray)}
.cell:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);background:#1d2129;color:#fff;padding:4px 8px;border-radius:4px;font-size:11px;white-space:nowrap;z-index:20;pointer-events:none;font-weight:400}

.today-col{background:#f7f8fa}

.matrix-legend{font-size:11px;color:var(--text-secondary);display:flex;gap:14px;margin-top:8px;flex-wrap:wrap}
.matrix-legend span{display:flex;align-items:center;gap:3px}
.legend-sq{width:12px;height:12px;border-radius:3px;display:inline-block}

.group-arrow{display:inline-block;width:14px;font-size:10px;color:var(--text-secondary);transition:transform .15s}
.group-summary td.route-cell{background:var(--gray-bg) !important;font-weight:500}
.group-summary:hover td{background:#eef0f3 !important}
.group-child td.route-cell{padding-left:22px !important}

.expand-btn{background:none;border:1px solid var(--border);padding:4px 10px;border-radius:5px;cursor:pointer;font-size:12px;color:var(--text-secondary)}
.expand-btn:hover{background:var(--gray-bg)}

.cov-bar{display:inline-block;width:32px;height:6px;background:var(--gray-bg);border-radius:3px;vertical-align:middle;margin-left:4px;overflow:hidden}
.cov-fill{display:block;height:100%;border-radius:3px}

/* Anomalies */
.anomaly-list{display:flex;flex-direction:column;gap:8px}
.anomaly-item{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:8px;font-size:13px}
.anomaly-item.danger{background:var(--red-bg)}
.anomaly-item.warning{background:var(--yellow-bg)}
.anomaly-icon{font-size:16px;flex-shrink:0;line-height:1.4}
.anomaly-body{flex:1}
.anomaly-body .route-name{font-weight:600}
.anomaly-body .detail{color:var(--text-secondary);font-size:12px;margin-top:2px}
.anomaly-empty{text-align:center;padding:20px;color:var(--green);font-size:13px}

/* Crawler health */
.crawler-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin-bottom:12px}
.crawler-card{border:1px solid var(--border);border-radius:8px;padding:14px;background:#fafbfc}
.crawler-card.alert{border-color:var(--red);background:var(--red-bg)}
.crawler-card .name{font-weight:600;font-size:13px;margin-bottom:6px}
.crawler-card .meta{font-size:12px;color:var(--text-secondary);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:500}
.badge-success{background:var(--green-bg);color:var(--green)}
.badge-failed{background:var(--red-bg);color:var(--red)}
.badge-running{background:var(--blue-bg);color:var(--blue)}
.sparkline{display:inline-flex;align-items:flex-end;gap:1px;height:20px;margin-left:8px;vertical-align:middle}
.sparkline .bar{width:4px;background:var(--blue);border-radius:1px;min-height:2px}
.fail-warn{color:var(--red);font-weight:600;font-size:12px}

/* Collapsible */
.collapsible-toggle{background:none;border:1px solid var(--border);padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px;color:var(--text-secondary);display:flex;align-items:center;gap:4px;margin-top:8px}
.collapsible-toggle:hover{background:var(--gray-bg)}
.collapsible-content{display:none;margin-top:12px}
.collapsible-content.open{display:block}

/* Log table */
.log-table{width:100%;border-collapse:collapse;font-size:12px}
.log-table th{text-align:left;padding:6px 8px;border-bottom:2px solid var(--border);font-weight:600;color:var(--text-secondary)}
.log-table td{padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:top}
.log-table tr.failed-row{background:var(--red-bg)}
.error-detail{font-size:11px;color:#c45656;padding:4px 8px;word-break:break-all;display:none}
.error-detail.open{display:table-row}

.loading{text-align:center;padding:60px;color:var(--text-secondary)}
.error-box{background:var(--red-bg);border:1px solid #fbc4c4;border-radius:6px;padding:12px;font-size:13px;color:#c45656}

@media(max-width:640px){
  .container{padding:12px 8px}
  header h1{font-size:16px}
  .overview-grid{grid-template-columns:repeat(2,1fr)}
  .ov-card .value{font-size:22px}
  .crawler-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>粤程助手 · 数据监控</h1>
    <div class="header-right">
      <span class="updated-at" id="updatedAt"></span>
      <span class="auto-label">60s 刷新</span>
      <button class="refresh-btn" id="refreshBtn" onclick="loadData()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        刷新
      </button>
    </div>
  </header>
  <div id="content"><div class="loading">加载中...</div></div>
</div>

<script>
// ── 广东 21 地级市（坐标用于流向线与异常脉冲点，name 对齐 DataV GeoJSON）──
const GD_CITIES = [
  {k:"广州",n:"广州市",lng:113.2644,lat:23.1291},
  {k:"深圳",n:"深圳市",lng:114.0579,lat:22.5431},
  {k:"东莞",n:"东莞市",lng:113.7518,lat:23.0209},
  {k:"佛山",n:"佛山市",lng:113.1220,lat:23.0288},
  {k:"中山",n:"中山市",lng:113.3921,lat:22.5175},
  {k:"珠海",n:"珠海市",lng:113.5530,lat:22.2559},
  {k:"惠州",n:"惠州市",lng:114.4126,lat:23.0794},
  {k:"汕头",n:"汕头市",lng:116.6819,lat:23.3540},
  {k:"江门",n:"江门市",lng:113.0942,lat:22.5903},
  {k:"湛江",n:"湛江市",lng:110.3594,lat:21.2707},
  {k:"肇庆",n:"肇庆市",lng:112.4720,lat:23.0515},
  {k:"茂名",n:"茂名市",lng:110.9253,lat:21.6630},
  {k:"清远",n:"清远市",lng:113.0510,lat:23.6852},
  {k:"韶关",n:"韶关市",lng:113.5917,lat:24.8014},
  {k:"揭阳",n:"揭阳市",lng:116.3553,lat:23.5437},
  {k:"梅州",n:"梅州市",lng:116.1178,lat:24.2988},
  {k:"阳江",n:"阳江市",lng:111.9824,lat:21.8579},
  {k:"河源",n:"河源市",lng:114.6977,lat:23.7462},
  {k:"汕尾",n:"汕尾市",lng:115.3752,lat:22.7865},
  {k:"潮州",n:"潮州市",lng:116.6220,lat:23.6567},
  {k:"云浮",n:"云浮市",lng:112.0445,lat:22.9298},
];
const GD_BY_KEY = Object.fromEntries(GD_CITIES.map(c => [c.k, c]));

// 广东主要县级市/市辖区/县 → 地级市（用于把车盈网的下辖级数据聚合回所属地级市）
const GD_DISTRICT_TO_CITY = {
  // 广州
  "增城":"广州","从化":"广州","花都":"广州","番禺":"广州","南沙":"广州","白云":"广州","天河":"广州","越秀":"广州","海珠":"广州","荔湾":"广州","黄埔":"广州",
  // 深圳
  "宝安":"深圳","龙岗":"深圳","南山":"深圳","福田":"深圳","罗湖":"深圳","龙华":"深圳","坪山":"深圳","光明":"深圳","盐田":"深圳","大鹏":"深圳",
  // 珠海
  "香洲":"珠海","金湾":"珠海","斗门":"珠海",
  // 佛山
  "禅城":"佛山","南海":"佛山","顺德":"佛山","三水":"佛山","高明":"佛山",
  // 江门
  "蓬江":"江门","江海":"江门","新会":"江门","台山":"江门","开平":"江门","鹤山":"江门","恩平":"江门",
  // 肇庆
  "端州":"肇庆","鼎湖":"肇庆","高要":"肇庆","四会":"肇庆","广宁":"肇庆","怀集":"肇庆","封开":"肇庆","德庆":"肇庆",
  // 惠州
  "惠城":"惠州","惠阳":"惠州","博罗":"惠州","惠东":"惠州","龙门":"惠州",
  // 茂名
  "茂南":"茂名","电白":"茂名","化州":"茂名","高州":"茂名","信宜":"茂名",
  // 湛江
  "赤坎":"湛江","霞山":"湛江","坡头":"湛江","麻章":"湛江","廉江":"湛江","吴川":"湛江","雷州":"湛江","徐闻":"湛江","遂溪":"湛江",
  // 阳江
  "江城":"阳江","阳东":"阳江","阳西":"阳江","阳春":"阳江",
  // 云浮
  "云城":"云浮","云安":"云浮","罗定":"云浮","新兴":"云浮","郁南":"云浮",
  // 清远
  "清城":"清远","清新":"清远","英德":"清远","连州":"清远","佛冈":"清远","阳山":"清远","连山":"清远","连南":"清远",
  // 韶关
  "武江":"韶关","浈江":"韶关","曲江":"韶关","乐昌":"韶关","南雄":"韶关","始兴":"韶关","仁化":"韶关","翁源":"韶关","新丰":"韶关","乳源":"韶关",
  // 梅州
  "梅江":"梅州","梅县":"梅州","兴宁":"梅州","大埔":"梅州","丰顺":"梅州","五华":"梅州","平远":"梅州","蕉岭":"梅州",
  // 河源
  "源城":"河源","紫金":"河源","龙川":"河源","连平":"河源","和平":"河源","东源":"河源",
  // 汕尾
  "陆丰":"汕尾","海丰":"汕尾","陆河":"汕尾",
  // 汕头
  "金平":"汕头","龙湖":"汕头","濠江":"汕头","潮阳":"汕头","潮南":"汕头","澄海":"汕头","南澳":"汕头",
  // 潮州
  "湘桥":"潮州","潮安":"潮州","饶平":"潮州",
  // 揭阳
  "榕城":"揭阳","揭东":"揭阳","揭西":"揭阳","惠来":"揭阳","普宁":"揭阳",
};

// 去掉各种后缀，然后尝试映射到广东地级市；若仍非粤内则返回 null
const normCity = s => (s || "").replace(/[（(][^）)]*[）)]$/, "").replace(/(市辖区|新区|开发区|市|县|区|自治州|地区)$/, "").trim();
function resolveGDCity(raw) {
  if (!raw) return null;
  // 处理 "徐闻/雷州" 等斜杠/顿号合并名：取第一个能解析到的粤内地级市
  for (const p of String(raw).split(/[\/／·、\s]+/)) {
    const n = normCity(p);
    if (!n) continue;
    if (GD_BY_KEY[n]) return n;
    if (GD_DISTRICT_TO_CITY[n]) return GD_DISTRICT_TO_CITY[n];
  }
  return null;
}
const isInGD = s => resolveGDCity(s) !== null;

const METRIC_CFG = {
  today:   { label:"今日班次", unit:"班", palette:["#e8f3ff","#bedaff","#4080ff","#165dff","#0e42d2"] },
  cov:     { label:"15 天覆盖率", unit:"%", palette:["#ffece8","#fff7e8","#fff1b8","#b7eb8f","#52c41a"] },
  routes:  { label:"活跃路线", unit:"条", palette:["#f2f3f5","#e8f3ff","#bedaff","#4080ff","#165dff"] },
  anomaly: { label:"异常路线", unit:"个", palette:["#f2f3f5","#fff7e8","#ffbb96","#ff7875","#f53f3f"] },
};

let _geoChart = null, _geoLoaded = false, _geoMetric = "today", _geoAggCache = null;

// 从 coverage.routes + anomalies 聚合出 city/flow/cross 数据
function aggregateGeo(coverage, anomalies) {
  const routes = coverage.routes || [];
  const cityMap = new Map();
  for (const c of GD_CITIES) {
    cityMap.set(c.k, { key:c.k, today:0, cov:0, routes:0, anomaly:0,
      src:{yuecx:{today:0,routes:0}, busboss:{today:0,routes:0}},
      _covDays:0 });
  }

  const flowMap = new Map();   // "from→to" -> value (省内)
  const crossMap = new Map();  // to -> { value, froms:Set }

  for (const r of routes) {
    const sKey = resolveGDCity(r.startCity);
    const eKey = resolveGDCity(r.endCity);
    const today = r.counts[0] || 0;
    const covDays = r.counts.filter(c => c > 0).length;

    if (sKey && cityMap.has(sKey)) {
      const entry = cityMap.get(sKey);
      entry.today += today;
      entry.routes += 1;
      entry._covDays = Math.max(entry._covDays, covDays);
      const src = entry.src[r.source];
      if (src) { src.today += today; src.routes += 1; }
    }

    if (sKey && eKey && sKey !== eKey) {
      const fk = `${sKey}→${eKey}`;
      flowMap.set(fk, (flowMap.get(fk) || 0) + today);
    } else if (sKey && !eKey) {
      const ek = normCity(r.endCity) || r.endCity;
      if (!crossMap.has(ek)) crossMap.set(ek, { to:ek, value:0, froms:new Set() });
      const x = crossMap.get(ek);
      x.value += today;
      x.froms.add(sKey);
    }
  }

  for (const entry of cityMap.values()) {
    entry.cov = Math.round(entry._covDays / 15 * 100);
  }

  for (const a of (anomalies || [])) {
    const sKey = resolveGDCity((a.route || "").split("→")[0]);
    if (sKey && cityMap.has(sKey)) cityMap.get(sKey).anomaly += 1;
  }

  const flows = [...flowMap.entries()]
    .map(([k, v]) => { const [f,t] = k.split("→"); return { from:f, to:t, value:v }; })
    .filter(x => x.value > 0)
    .sort((a,b) => b.value - a.value)
    .slice(0, 20);

  const cross = [...crossMap.values()]
    .map(x => ({ to:x.to, value:x.value, from:[...x.froms].slice(0,3).join("/") + (x.froms.size > 3 ? "等" : "") }))
    .filter(x => x.value > 0)
    .sort((a,b) => b.value - a.value);

  return { cities:[...cityMap.values()], flows, cross };
}

async function ensureGeoJson() {
  if (_geoLoaded) return true;
  const sources = [
    "/geo/440000_full.json",  // 本地自托管，优先
    "https://geo.datav.aliyun.com/areas_v3/bound/440000_full.json",  // CDN fallback
  ];
  let lastErr = null;
  for (const url of sources) {
    try {
      const resp = await fetch(url);
      if (!resp.ok) throw new Error("HTTP " + resp.status);
      const geo = await resp.json();
      echarts.registerMap("guangdong", geo);
      _geoLoaded = true;
      return true;
    } catch (e) { lastErr = e; }
  }
  const el = document.getElementById("geoMap");
  if (el) el.innerHTML = `<div class="error-box" style="margin:40px">地图边界数据加载失败: ${esc(lastErr?.message || "unknown")}</div>`;
  return false;
}

async function initGeoMap(coverage, anomalies) {
  const host = document.getElementById("geoMap");
  if (!host || !window.echarts) return;
  _geoAggCache = { all: aggregateGeo(coverage, anomalies) };
  // 分数据源预聚合
  for (const src of ["yuecx", "busboss"]) {
    const filtered = { ...coverage, routes: (coverage.routes || []).filter(r => r.source === src) };
    const anoms = (anomalies || []).filter(a => a.source === src);
    _geoAggCache[src] = aggregateGeo(filtered, anoms);
  }

  const ok = await ensureGeoJson();
  if (!ok) return;

  _geoChart = echarts.init(host);
  renderGeoMap();

  document.querySelectorAll("#mapTabs .map-tab").forEach(t => {
    t.onclick = () => {
      document.querySelectorAll("#mapTabs .map-tab").forEach(x => x.classList.remove("active"));
      t.classList.add("active");
      _geoMetric = t.dataset.metric;
      renderGeoMap();
    };
  });
  document.getElementById("mapSourceFilter").onchange = renderGeoMap;
  document.getElementById("mapShowFlows").onchange = renderGeoMap;
  document.getElementById("mapShowLabels").onchange = renderGeoMap;

  _geoChart.on("click", p => {
    if (p.seriesType === "map" && p.name) {
      filterMatrixByCity(normCity(p.name));
    }
  });

  window.addEventListener("resize", () => _geoChart && _geoChart.resize());
}

function renderGeoMap() {
  if (!_geoChart || !_geoAggCache) return;
  const src = document.getElementById("mapSourceFilter")?.value || "all";
  const showFlows = document.getElementById("mapShowFlows")?.checked;
  const showLabels = document.getElementById("mapShowLabels")?.checked;
  const agg = _geoAggCache[src] || _geoAggCache.all;
  const cfg = METRIC_CFG[_geoMetric];

  const mapData = agg.cities.map(c => {
    const meta = GD_BY_KEY[c.key];
    return { name: meta.n, value: c[_geoMetric], _city: c };
  });

  const maxVal = Math.max(1, ...mapData.map(d => d.value || 0));
  const vmMax = _geoMetric === "cov" ? 100 : Math.max(5, maxVal);

  const flowLines = showFlows ? agg.flows.map(l => {
    const a = GD_BY_KEY[l.from], b = GD_BY_KEY[l.to];
    if (!a || !b) return null;
    return { coords:[[a.lng,a.lat],[b.lng,b.lat]], value:l.value, fromName:l.from, toName:l.to };
  }).filter(Boolean) : [];

  const anomalyPoints = agg.cities.filter(c => c.anomaly > 0).map(c => {
    const m = GD_BY_KEY[c.key];
    return { name:c.key, value:[m.lng, m.lat, c.anomaly] };
  });

  const maxFlow = Math.max(1, ...flowLines.map(f => f.value));

  const option = {
    tooltip:{
      trigger:"item",
      formatter: p => {
        if (p.seriesType === "map") {
          const c = p.data?._city;
          if (!c) return p.name;
          return `<b>${c.key}</b><br/>
            今日班次：${c.today} 班（粤程 ${c.src.yuecx.today} / 车盈网 ${c.src.busboss.today}）<br/>
            15天覆盖：${c.cov}%<br/>
            活跃路线：${c.routes} 条<br/>
            异常：${c.anomaly} 个`;
        }
        if (p.seriesType === "lines") {
          return `${p.data.fromName} → ${p.data.toName}<br/>今日班次：${p.data.value}`;
        }
        if (p.seriesType === "effectScatter") {
          return `<b>${p.data.name}</b><br/>异常：${p.data.value[2]} 个`;
        }
        return p.name;
      },
    },
    visualMap:{
      left:"left", bottom:20, min:0, max:vmMax,
      text:[`高（${cfg.unit}）`, "低"],
      inRange:{ color: cfg.palette },
      textStyle:{ fontSize:11, color:"#86909c" },
      calculable:true, itemWidth:14, itemHeight:100,
    },
    geo:{
      map:"guangdong", roam:true, zoom:1.15,
      itemStyle:{ areaColor:"#f5f7fa", borderColor:"#d9d9d9" },
      emphasis:{ itemStyle:{ areaColor:"#ffd591" }, label:{ show:true, color:"#1d2129" } },
      label:{ show:showLabels, color:"#555", fontSize:10 },
    },
    series:[
      { type:"map", map:"guangdong", geoIndex:0, data:mapData },
      ...(flowLines.length ? [{
        type:"lines", coordinateSystem:"geo", zlevel:2,
        effect:{ show:true, period:5, trailLength:.3, symbol:"arrow", symbolSize:5, color:"#165dff" },
        lineStyle:{ color:"#165dff", curveness:.25, opacity:.55 },
        data: flowLines.map(l => ({
          ...l,
          lineStyle:{ width: Math.max(.8, Math.min(5, l.value / maxFlow * 5)) },
        })),
      }] : []),
      ...(anomalyPoints.length ? [{
        type:"effectScatter", coordinateSystem:"geo", zlevel:3,
        rippleEffect:{ scale:3, brushType:"stroke" },
        symbolSize: v => 6 + v[2] * 2,
        itemStyle:{ color:"#f53f3f" },
        data: anomalyPoints,
      }] : []),
    ],
  };
  _geoChart.setOption(option, true);
  renderGeoTopN(agg);
  renderGeoCross(agg);
}

const CRAWLER_LABELS = {
  yuecx_all_routes: "亿路行 · 全量路线",
  yuecx_hot_routes: "亿路行 · 热门路线",
  yuecx_sync_meta: "亿路行 · 元数据同步",
  busboss_all_routes: "车盈网 · 全量路线",
  busboss_sync_meta: "车盈网 · 元数据同步",
};
const SOURCE_LABELS = { yuecx: "粤程", busboss: "车盈网" };

function esc(s) {
  if (!s) return "";
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function fmtDuration(ms) {
  if (ms == null) return "-";
  if (ms < 1000) return ms + "ms";
  const s = Math.floor(ms / 1000);
  if (s < 60) return s + "秒";
  return Math.floor(s / 60) + "分" + (s % 60 > 0 ? s % 60 + "秒" : "");
}

function fmtTime(iso) {
  if (!iso) return "-";
  const d = new Date(iso);
  const opts = { timeZone: "Asia/Shanghai" };
  const time = d.toLocaleTimeString("zh-CN", { ...opts, hour: "2-digit", minute: "2-digit" });
  const today = new Date().toLocaleDateString("zh-CN", opts);
  const dStr = d.toLocaleDateString("zh-CN", opts);
  return dStr === today ? "今天 " + time : d.toLocaleDateString("zh-CN", { ...opts, month: "2-digit", day: "2-digit" }) + " " + time;
}

function fmtDateShort(dateStr) {
  const parts = dateStr.split("-");
  return parts[1] + "/" + parts[2];
}

function isToday(dateStr) {
  const now = new Date();
  const bj = new Date(now.toLocaleString("en-US", { timeZone: "Asia/Shanghai" }));
  const todayStr = bj.getFullYear() + "-" + String(bj.getMonth() + 1).padStart(2, "0") + "-" + String(bj.getDate()).padStart(2, "0");
  return dateStr === todayStr;
}

function weekday(dateStr) {
  const d = new Date(dateStr + "T00:00:00+08:00");
  return ["日","一","二","三","四","五","六"][d.getDay()];
}

let _covData = null;

function renderCoverage(cov) {
  _covData = cov;
  const dates = cov.dates || [];
  const routes = cov.routes || [];

  const groups = {};
  for (const r of routes) {
    const cov15 = r.counts.filter(c => c > 0).length;
    const total = r.counts.reduce((a, b) => a + b, 0);
    const key = r.startCity;
    if (!groups[key]) groups[key] = { city: key, routes: [], totalIntervals: 0, covDays: 0 };
    groups[key].routes.push({ ...r, covPct: Math.round(cov15 / 15 * 100), totalIntervals: total });
    groups[key].totalIntervals += total;
    groups[key].covDays = Math.max(groups[key].covDays, cov15);
  }

  const sortedGroups = Object.values(groups).sort((a, b) => b.totalIntervals - a.totalIntervals);
  for (const g of sortedGroups) g.routes.sort((a, b) => b.totalIntervals - a.totalIntervals);

  const toolbar = `<div class="toolbar">
    <select id="sourceFilter" onchange="applyGroupFilters()">
      <option value="all">全部数据源</option>
      <option value="yuecx">粤程</option>
      <option value="busboss">车盈网</option>
    </select>
    <select id="covFilter" onchange="applyGroupFilters()">
      <option value="0">显示全部路线</option>
      <option value="20" selected>覆盖率 ≥ 20%</option>
      <option value="50">覆盖率 ≥ 50%</option>
      <option value="80">覆盖率 ≥ 80%</option>
    </select>
    <input type="text" id="citySearch" placeholder="搜索城市名..." oninput="applyGroupFilters()">
    <button class="expand-btn" onclick="toggleAllGroups(true)">展开全部</button>
    <button class="expand-btn" onclick="toggleAllGroups(false)">收起全部</button>
  </div>`;

  const dateHeaders = dates.map(d =>
    `<th class="${isToday(d) ? 'today-col' : ''}">${fmtDateShort(d)}<br><span style="font-weight:400">${weekday(d)}</span></th>`
  ).join("");

  let html = '';
  for (const g of sortedGroups) {
    const groupRoutes = g.routes;
    const sources = [...new Set(groupRoutes.map(r => r.source))];
    const srcTags = sources.map(s => `<span class="source-tag ${s}">${SOURCE_LABELS[s] || s}</span>`).join(" ");
    const avgCov = Math.round(groupRoutes.reduce((s, r) => s + r.covPct, 0) / groupRoutes.length);
    const covColor = avgCov >= 60 ? 'var(--green)' : avgCov >= 30 ? 'var(--yellow)' : 'var(--red)';

    const summaryRow = groupRoutes.length === 1
      ? renderRouteRow(groupRoutes[0], dates)
      : `<tr class="group-summary" data-city="${esc(g.city)}">
          <td class="route-cell" style="cursor:pointer" onclick="toggleGroup('${esc(g.city)}')">
            <span class="group-arrow" id="arrow-${esc(g.city)}">▶</span>
            <b>${esc(g.city)}</b>出发 ${srcTags}
            <span style="color:var(--text-secondary);font-size:11px;margin-left:6px">${groupRoutes.length}条路线 · ${g.totalIntervals.toLocaleString()}班次</span>
          </td>
          ${dates.map((d, i) => {
            const dayTotal = groupRoutes.reduce((s, r) => s + r.counts[i], 0);
            let cls = dayTotal > 50 ? 'c-green' : dayTotal > 0 ? 'c-yellow' : 'c-gray';
            const todayCls = isToday(d) ? ' today-col' : '';
            return `<td class="${todayCls}"><span class="cell ${cls}" data-tip="${d}: ${dayTotal} 班次">${dayTotal}</span></td>`;
          }).join("")}
        </tr>`;

    const childRows = groupRoutes.length === 1 ? '' : groupRoutes.map(r => {
      const row = renderRouteRow(r, dates);
      return row.replace('<tr ', `<tr class="group-child" data-group="${esc(g.city)}" style="display:none" `);
    }).join("");

    html += summaryRow + childRows;
  }

  const legend = `<div class="matrix-legend">
    <span><span class="legend-sq" style="background:var(--green-bg)"></span> >10 班次</span>
    <span><span class="legend-sq" style="background:var(--yellow-bg)"></span> 1~10 班次</span>
    <span><span class="legend-sq" style="background:var(--gray-bg)"></span> 0 / 无数据</span>
  </div>`;

  const visibleCount = sortedGroups.reduce((s, g) => s + g.routes.length, 0);

  return `<div class="section" id="matrixSection" style="display:none">
    <div class="section-title" style="justify-content:space-between">
      <span>数据覆盖矩阵 <span class="count" id="covCount">${visibleCount} 条路线 · ${sortedGroups.length} 个出发城市 · ${dates.length} 天</span></span>
      <button class="expand-btn" onclick="hideMatrix()" style="margin-left:auto">✕ 关闭</button>
    </div>
    ${toolbar}
    <div class="matrix-wrap"><table class="matrix" id="matrixTable"><thead><tr><th class="route-col">路线 / 城市</th>${dateHeaders}</tr></thead><tbody>${html}</tbody></table></div>
    ${legend}
  </div>`;
}

function hideMatrix() {
  const sec = document.getElementById("matrixSection");
  if (sec) sec.style.display = "none";
  const input = document.getElementById("citySearch");
  if (input) { input.value = ""; applyGroupFilters(); }
}

function renderRouteRow(r, dates) {
  const sourceTag = `<span class="source-tag ${r.source}">${SOURCE_LABELS[r.source] || r.source}</span>`;
  const covBar = `<span class="cov-bar" title="覆盖率 ${r.covPct}%"><span class="cov-fill" style="width:${r.covPct}%;background:${r.covPct >= 60 ? 'var(--green)' : r.covPct >= 30 ? 'var(--yellow)' : 'var(--red)'}"></span></span>`;
  const routeLabel = `${esc(r.startCity)}→${esc(r.endCity)} ${sourceTag} ${covBar}`;

  const cells = r.counts.map((c, i) => {
    let cls = c > 10 ? 'c-green' : c > 0 ? 'c-yellow' : 'c-gray';
    const todayCls = isToday(dates[i]) ? ' today-col' : '';
    return `<td class="${todayCls}"><span class="cell ${cls}" data-tip="${dates[i]}: ${c} 班次">${c}</span></td>`;
  }).join("");

  return `<tr data-source="${r.source}" data-cities="${esc(r.startCity + r.endCity)}" data-cov="${r.covPct}"><td class="route-cell">${routeLabel}</td>${cells}</tr>`;
}

function toggleGroup(city) {
  const children = document.querySelectorAll(`.group-child[data-group="${city}"]`);
  const arrow = document.getElementById('arrow-' + city);
  const visible = children[0]?.style.display !== 'none';
  children.forEach(el => el.style.display = visible ? 'none' : '');
  if (arrow) arrow.textContent = visible ? '▶' : '▼';
}

function toggleAllGroups(expand) {
  document.querySelectorAll('.group-child').forEach(el => el.style.display = expand ? '' : 'none');
  document.querySelectorAll('.group-arrow').forEach(el => el.textContent = expand ? '▼' : '▶');
}

function applyGroupFilters() {
  const source = document.getElementById("sourceFilter").value;
  const minCov = parseInt(document.getElementById("covFilter").value) || 0;
  const search = document.getElementById("citySearch").value.trim().toLowerCase();

  let shown = 0;
  document.querySelectorAll("#matrixTable tbody tr").forEach(tr => {
    if (tr.classList.contains('group-summary')) {
      const city = (tr.dataset.city || "").toLowerCase();
      const show = !search || city.includes(search);
      tr.style.display = show ? '' : 'none';
      return;
    }
    const s = tr.dataset.source;
    const c = (tr.dataset.cities || "").toLowerCase();
    const cov = parseInt(tr.dataset.cov) || 0;
    const show = (source === "all" || s === source) && (!search || c.includes(search)) && cov >= minCov;
    tr.style.display = show ? '' : 'none';
    if (show) shown++;
  });
}

function renderAnomalies(anomalies) {
  if (!anomalies || anomalies.length === 0) {
    return `<div class="section">
      <div class="section-title">数据异常告警</div>
      <div class="anomaly-empty">✓ 暂无异常，一切正常</div>
    </div>`;
  }

  const icons = { danger: "🔴", warning: "🟡" };
  const typeLabels = {
    all_zero_residue: "余座全零",
    abnormal_price: "价格异常",
    stale_data: "数据过期",
    count_drop: "班次骤降",
  };

  // 按 route + type 去重聚合，减少重复噪音
  const grouped = new Map();
  for (const a of anomalies) {
    const key = a.route + "|" + a.type + "|" + (a.source || "");
    if (!grouped.has(key)) {
      grouped.set(key, { ...a, count: 0, details: [] });
    }
    const g = grouped.get(key);
    g.count += 1;
    if (g.details.length < 3 && a.detail) g.details.push(a.detail);
    if (a.severity === "danger") g.severity = "danger";
  }
  const aggregated = [...grouped.values()].sort((a, b) => {
    if (a.severity !== b.severity) return a.severity === "danger" ? -1 : 1;
    return b.count - a.count;
  });

  const DEFAULT_SHOW = 5;
  const renderItem = a => `
    <div class="anomaly-item ${a.severity}">
      <span class="anomaly-icon">${icons[a.severity] || "⚠️"}</span>
      <div class="anomaly-body">
        <span class="route-name">${esc(a.route)}</span>
        <span style="color:var(--text-secondary);font-size:12px;margin-left:6px">[${typeLabels[a.type] || a.type}]</span>
        <span style="font-size:11px;color:var(--text-secondary);margin-left:4px">${SOURCE_LABELS[a.source] || ""}</span>
        ${a.count > 1 ? `<span style="font-size:11px;color:var(--red);margin-left:4px">×${a.count}</span>` : ""}
        <div class="detail">${esc(a.details[0] || a.detail || "")}</div>
      </div>
    </div>`;

  const visible = aggregated.slice(0, DEFAULT_SHOW).map(renderItem).join("");
  const hidden = aggregated.slice(DEFAULT_SHOW).map(renderItem).join("");
  const moreBtn = aggregated.length > DEFAULT_SHOW
    ? `<button class="collapsible-toggle" onclick="toggleAnomalies()" id="anomalyToggleBtn" data-rest="${aggregated.length - DEFAULT_SHOW}" style="margin-top:10px">展开剩余 ${aggregated.length - DEFAULT_SHOW} 条</button>`
    : "";

  return `<div class="section">
    <div class="section-title">数据异常告警 <span class="count">${aggregated.length} 类 · ${anomalies.length} 条</span></div>
    <div class="anomaly-list">${visible}</div>
    <div class="anomaly-list" id="anomalyHidden" style="display:none;margin-top:8px">${hidden}</div>
    ${moreBtn}
  </div>`;
}

function toggleAnomalies() {
  const el = document.getElementById("anomalyHidden");
  const btn = document.getElementById("anomalyToggleBtn");
  if (!el) return;
  const isHidden = el.style.display === "none";
  el.style.display = isHidden ? "" : "none";
  if (btn) btn.textContent = isHidden ? "收起" : `展开剩余 ${btn.dataset.rest} 条`;
}

function renderCrawlerHealth(health) {
  const crawlers = health.crawlers || [];
  const recentLogs = health.recentLogs || [];

  const cards = crawlers.map(c => {
    const label = CRAWLER_LABELS[c.name] || c.name;
    const isAlert = c.consecutiveFailures >= 2;
    const lr = c.lastRun;

    let statusBadge = '<span class="badge" style="background:var(--gray-bg);color:var(--gray)">无记录</span>';
    if (lr) {
      const map = {
        success: '<span class="badge badge-success">成功</span>',
        failed: '<span class="badge badge-failed">失败</span>',
        running: '<span class="badge badge-running">运行中</span>',
      };
      statusBadge = map[lr.status] || statusBadge;
    }

    const maxDur = Math.max(...(c.recentDurations || [1]), 1);
    const sparkBars = (c.recentDurations || []).map(d =>
      `<span class="bar" style="height:${Math.max(2, Math.round(d / maxDur * 20))}px" title="${fmtDuration(d)}"></span>`
    ).join("");
    const sparkHtml = sparkBars ? `<span class="sparkline">${sparkBars}</span>` : "";

    const failWarn = c.consecutiveFailures >= 2
      ? `<span class="fail-warn">连续失败 ${c.consecutiveFailures} 次!</span>` : "";

    return `<div class="crawler-card${isAlert ? ' alert' : ''}">
      <div class="name">${esc(label)}</div>
      <div class="meta">
        ${statusBadge}
        ${lr ? `<span>${fmtTime(lr.startedAt)}</span>` : ""}
        ${lr?.recordCount != null ? `<span>${lr.recordCount}条</span>` : ""}
        ${lr?.durationMs != null ? `<span>${fmtDuration(lr.durationMs)}</span>` : ""}
        ${sparkHtml}
        ${failWarn}
      </div>
    </div>`;
  }).join("");

  const logRows = recentLogs.map((l, i) => {
    const isFailed = l.status === "failed";
    const statusMap = {
      success: '<span class="badge badge-success">成功</span>',
      failed: '<span class="badge badge-failed">失败</span>',
      running: '<span class="badge badge-running">运行中</span>',
    };
    const row = `<tr class="${isFailed ? 'failed-row' : ''}" ${l.errorMessage ? `style="cursor:pointer" onclick="toggleErr(${i})"` : ""}>
      <td>${fmtTime(l.startedAt)}</td>
      <td>${esc(CRAWLER_LABELS[l.crawler] || l.crawler)}</td>
      <td>${statusMap[l.status] || l.status}</td>
      <td>${fmtDuration(l.durationMs)}</td>
      <td>${l.recordCount ?? "-"}</td>
    </tr>`;
    const err = l.errorMessage ? `<tr class="error-detail" id="err-${i}"><td colspan="5" style="color:#c45656;font-size:11px">${esc(l.errorMessage)}</td></tr>` : "";
    return row + err;
  }).join("");

  return `<div class="section">
    <div class="section-title">爬虫运行健康度</div>
    <div class="crawler-grid">${cards}</div>
    <button class="collapsible-toggle" onclick="toggleLogs()">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
      查看详细日志（最近 30 条）
    </button>
    <div class="collapsible-content" id="logPanel">
      ${logRows ? `<table class="log-table"><thead><tr><th>时间</th><th>爬虫</th><th>状态</th><th>耗时</th><th>记录数</th></tr></thead><tbody>${logRows}</tbody></table>` : '<div style="text-align:center;color:var(--text-secondary);padding:16px">暂无日志</div>'}
    </div>
  </div>`;
}

function toggleLogs() {
  document.getElementById("logPanel").classList.toggle("open");
}
function toggleErr(i) {
  const el = document.getElementById("err-" + i);
  if (el) el.classList.toggle("open");
}

async function loadData() {
  const btn = document.getElementById("refreshBtn");
  btn.disabled = true;
  try {
    const resp = await fetch("/api/monitor/dashboard");
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    const data = await resp.json();

    document.getElementById("content").innerHTML =
      renderOverview(data.overview) +
      renderGeoSection() +
      renderCoverage(data.coverage) +
      renderAnomalies(data.anomalies) +
      renderCrawlerHealth(data.crawlerHealth);

    initGeoMap(data.coverage, data.anomalies);

    const now = new Date();
    document.getElementById("updatedAt").textContent =
      "更新于 " + now.toLocaleTimeString("zh-CN", { timeZone: "Asia/Shanghai", hour: "2-digit", minute: "2-digit", second: "2-digit" });
  } catch (err) {
    document.getElementById("content").innerHTML =
      `<div class="section"><div class="error-box">加载失败: ${esc(err.message)}</div></div>`;
  } finally {
    btn.disabled = false;
  }
}

loadData();
setInterval(loadData, 60000);
</script>
</body>
</html>
